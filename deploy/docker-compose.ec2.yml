services:
  web:
    image: ${DOCKERHUB_USER:?DOCKERHUB_USER is required}/voteunity-app:${APP_TAG:-latest}
    container_name: voteunity-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-voting_system}
      DB_USER: ${MYSQL_USER:-voteunity}
      DB_PASS: ${MYSQL_PASSWORD:-voteunitypass}
      ALLOW_GD_FALLBACK: "false"
    ports:
      - "80:80"
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: voteunity-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-voting_system}
      MYSQL_USER: ${MYSQL_USER:-voteunity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-voteunitypass}
    volumes:
      - db_data:/var/lib/mysql
      - ../sql/voting_system.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
