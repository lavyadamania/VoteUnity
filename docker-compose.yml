services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voteunity-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: voting_system
      DB_USER: voteunity
      DB_PASS: voteunitypass
      ALLOW_GD_FALLBACK: "false"
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: voteunity-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: voting_system
      MYSQL_USER: voteunity
      MYSQL_PASSWORD: voteunitypass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/voting_system.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db_data:
